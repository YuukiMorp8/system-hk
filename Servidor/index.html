```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #1e1e2f, #3a3a5f);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
        }

        .tabs button {
            flex: 1;
            padding: 10px;
            border: none;
            cursor: pointer;
            background: #eee;
            transition: 0.3s;
        }

        .tabs button.active {
            background: #4CAF50;
            color: white;
        }

        .form {
            display: none;
            flex-direction: column;
        }

        .form.active {
            display: flex;
        }

        input {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button.submit {
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button.submit:hover {
            background: #45a049;
        }

        .footer {
            margin-top: 10px;
            text-align: center;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Minha Conta</h2>

    <div class="tabs">
        <button class="active">Login</button>
        <button>Criar Conta</button>
    </div>

    <!-- LOGIN -->
    <div class="form active">
        <input type="text" placeholder="Usuário">
        <input type="password" placeholder="Senha">
        <button class="submit">Entrar</button>
    </div>

    <!-- CADASTRO -->
    <div class="form">
        <input type="text" placeholder="Usuário">
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Senha">
        <button class="submit">Criar Conta</button>
    </div>

    <div class="footer">
        © 2026 - Seu Projeto
    </div>
</div>

</body>
</html>
```
