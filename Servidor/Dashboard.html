<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Sistema</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Container principal */
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-section h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .welcome-section p {
            color: #666;
            font-size: 14px;
        }

        .welcome-section span {
            color: #667eea;
            font-weight: 600;
        }

        /* Card do Relógio */
        .clock-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .time {
            font-size: 48px;
            font-weight: 700;
            color: white;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
        }

        .date {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 5px;
        }

        /* Cards de informações */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: fadeInUp 0.6s ease-out;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-card:nth-child(1) { animation-delay: 0.1s; }
        .info-card:nth-child(2) { animation-delay: 0.2s; }
        .info-card:nth-child(3) { animation-delay: 0.3s; }

        .card-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .info-card h3 {
            color: #667eea;
            font-size: 16px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .info-card .label {
            color: #666;
            font-size: 12px;
        }

        /* Botão Logout */
        .logout-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* Footer */
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            font-size: 12px;
            opacity: 0.8;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .time {
                font-size: 36px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <div class="header">
            <div class="welcome-section">
                <h1>Olá, <span id="userName">Usuário</span>! 👋</h1>
                <p>Bem-vindo ao seu dashboard</p>
            </div>
            <div class="clock-card">
                <div class="time" id="clock">00:00:00</div>
                <div class="date" id="date">Carregando...</div>
            </div>
            <button class="logout-btn" onclick="logout()">
                🔓 Sair
            </button>
        </div>

        <!-- Cards Informativos -->
        <div class="info-grid">
            <div class="info-card">
                <div class="card-icon">📅</div>
                <h3>Dia da Semana</h3>
                <div class="value" id="weekday">-</div>
                <div class="label">Hoje é um ótimo dia!</div>
            </div>

            <div class="info-card">
                <div class="card-icon">⏰</div>
                <h3>Status</h3>
                <div class="value" id="status">Ativo</div>
                <div class="label">Você está logado</div>
            </div>

            <div class="info-card">
                <div class="card-icon">💡</div>
                <h3>Mensagem</h3>
                <div class="value" id="greeting">-</div>
                <div class="label">Tenha um excelente dia!</div>
            </div>
        </div>

        <div class="footer">
            <p>Sistema de Dashboard | © 2024</p>
        </div>
    </div>

    <script>
        // Função para atualizar o relógio
        function updateClock() {
            const now = new Date();
            
            // Formata a hora
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const timeString = `${hours}:${minutes}:${seconds}`;
            
            // Formata a data
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const dateString = `${day}/${month}/${year}`;
            
            // Dias da semana
            const weekdays = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
            const weekday = weekdays[now.getDay()];
            
            // Atualiza o DOM
            document.getElementById('clock').textContent = timeString;
            document.getElementById('date').textContent = dateString;
            document.getElementById('weekday').textContent = weekday;
            
            // Mensagem de saudação baseada na hora
            const hour = now.getHours();
            let greeting = '';
            if (hour < 12) {
                greeting = 'Bom dia! 🌅';
            } else if (hour < 18) {
                greeting = 'Boa tarde! ☀️';
            } else {
                greeting = 'Boa noite! 🌙';
            }
            document.getElementById('greeting').textContent = greeting;
        }
        
        // Recupera o nome do usuário (simulado - você pode pegar do localStorage ou sessionStorage)
        function getUserName() {
            // Aqui você pode recuperar o nome do usuário do localStorage, sessionStorage ou de onde salvou no login
            let userName = localStorage.getItem('userName');
            if (!userName) {
                // Se não tiver nome salvo, usa um padrão ou pede
                userName = 'Visitante';
            }
            document.getElementById('userName').textContent = userName;
        }
        
        // Função de logout
        function logout() {
            if (confirm('Tem certeza que deseja sair?')) {
                // Limpa dados do usuário se necessário
                // localStorage.removeItem('userName');
                // sessionStorage.clear();
                
                // Redireciona para a página de login
                window.location.href = 'index.html'; // Ajuste para o nome do seu arquivo de login
            }
        }
        
        // Atualiza o relógio a cada segundo
        setInterval(updateClock, 1000);
        
        // Inicializa
        getUserName();
        updateClock();
        
        // Adiciona efeito de carregamento suave
        window.addEventListener('load', () => {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s';
            setTimeout(() => {
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
