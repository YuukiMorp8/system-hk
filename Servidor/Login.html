<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>

    <h2>Login</h2>

    <input id="usuario" type="text" placeholder="Usuário">
    <br><br>

    <input id="senha" type="password" placeholder="Senha">
    <br><br>

    <button id="btnLogin">Entrar</button>

    <hr>

    <h2>Criar Conta</h2>

    <input id="novoUsuario" type="text" placeholder="Novo usuário">
    <br><br>

    <input id="novoEmail" type="email" placeholder="Email">
    <br><br>

    <input id="novaSenha" type="password" placeholder="Nova senha">
    <br><br>

    <button id="btnCriarConta">Criar Conta</button>

    <script src="Sistema/Script.js"></script>
</body>
</html>
